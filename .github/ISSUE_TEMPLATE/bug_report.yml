name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't attach documents with personal information, and report security problems privately (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Paper Mirror version
      description: Help > About Paper Mirror
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File that triggers it
      description: If a particular PDF, image or model causes it, describe it or attach a safe copy.
