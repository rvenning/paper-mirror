name: Website

on:
  push:
    branches: [main]
    paths: [site/**, docs/screenshots/**, assets/icon-256.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        # Screenshots and the icon live once in the repository and are copied in here.
        run: |
          mkdir -p _site/screenshots
          cp -r site/* _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp assets/icon-256.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
