[package]
name = "paper-mirror"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A lightweight Windows 11 PDF and image viewer inspired by macOS Preview"
publish = false
build = "build.rs"

[lib]
name = "paper_mirror"
path = "src/lib.rs"

[[bin]]
name = "paper-mirror"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-winit-software",
    "software-renderer-path",
    "software-renderer-systemfonts",
    "accessibility",
    "raw-window-handle-06",
    "unstable-winit-030",
] }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }

rfd = { version = "=0.17.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = { version = "=0.47.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
