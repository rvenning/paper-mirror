[package]
name = "paper-mirror"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A lightweight Windows 11 PDF and image viewer inspired by macOS Preview"
publish = false
build = "build.rs"

[lib]
name = "paper_mirror"
path = "src/lib.rs"

[[bin]]
name = "paper-mirror"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-winit-software",
    "software-renderer-path",
    "software-renderer-systemfonts",
    "accessibility",
    "raw-window-handle-06",
    "unstable-winit-030",
] }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }

rfd = { version = "=0.17.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = { version = "=0.47.0", default-features = false }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std", "opentype-layout"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp", "exr", "tiff"] }
png = "=0.18.1"
tiff = "=0.11.3"
moxcms = "=0.8.1"
kamadak-exif = "=0.6.2"
raw-window-handle = "=0.6.2"
windows-collections = "=0.3.2"
flate2 = "=1.1.10"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM and WinRT interfaces windows-sys lacks: the print dialog, the Share sheet and
# Start-menu shortcuts. Already in the tree (via Slint's accessibility backend).
windows = { version = "=0.62.2", features = [
    "ApplicationModel_DataTransfer",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev]
# Line tables keep backtraces useful; full debug info made each test binary ~500 MB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
